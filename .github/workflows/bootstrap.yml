name: Bootstrap governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required governance files
        run: |
          test -f .gitignore
          test -f LICENSE
          test -f README.md
