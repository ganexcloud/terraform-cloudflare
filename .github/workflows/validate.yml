name: Validate Terraform module

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.58.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pipx install pre-commit
      - name: Validate public entrypoints
        run: |
          terraform fmt -check -recursive
          for directory in . modules/zone modules/record modules/firewall/modules/rulesets modules/firewall/modules/firewall modules/firewall/modules/ip-list modules/firewall/modules/page-rules; do
            terraform -chdir="$directory" init -backend=false
            terraform -chdir="$directory" validate
          done
          pre-commit run --all-files
